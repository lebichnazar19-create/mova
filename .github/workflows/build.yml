name: Збірка APK

# На кожен push у main — зібрати Android APK через Buildozer і покласти
# готовий файл в Artifacts запуску. workflow_dispatch — щоб можна було
# перезапустити збірку вручну без нового коміту.
#
# Buildozer ставиться напряму на ubuntu-latest (без ArtemSBulgakov/
# buildozer-action — його Docker-образ перестав збиратись).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-apk:
    name: Buildozer -> APK
    # Не ubuntu-latest: рецепт libffi падає на autoreconf з занадто
    # новими autoconf/libtool у ubuntu-24.04 ("possibly undefined macro:
    # LT_SYS_SYMBOL_USCORE"). 22.04 — перевірена версія для p4a-збірок.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Android Gradle Plugin (пакування APK, останній крок збірки)
      # вимагає саме Java 17 — на раннері є кілька JDK одразу, і без
      # цього кроку активною лишається JDK 11 ("Android Gradle plugin
      # requires Java 17 to run. You are currently using Java 11.").
      # setup-java виставляє JAVA_HOME/PATH для решти кроків job —
      # надійніше за ручний експорт конкретного шляху до JDK.
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Системні пакети для python-for-android
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache \
            libtool-bin libltdl-dev automake m4

      - name: Buildozer + Cython
        run: pip install buildozer cython

      # Відомості про збірку для «Довідки» (yadro/zbirka.py) і versionCode
      # з yadro/versiya.py — щоб з телефона було видно, що встановлено
      - name: Відомості про збірку і числова версія
        run: |
          python3 - <<'PY'
          import datetime, os, pathlib, re
          from yadro.versiya import ВЕРСІЯ, ЧИСЛОВА_ВЕРСІЯ
          дата = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          коміт = os.environ.get("GITHUB_SHA", "")[:7] or "—"
          pathlib.Path("yadro/zbirka.py").write_text(
              f'"""Збірка (згенеровано workflow)."""\n\nДАТА = "{дата}"\nКОМІТ = "{коміт}"\n', encoding="utf-8")
          spec = pathlib.Path("buildozer.spec")
          if spec.is_file():
              spec.write_text(re.sub(r"^android\.numeric_version = .*$", f"android.numeric_version = {ЧИСЛОВА_ВЕРСІЯ}", spec.read_text(encoding="utf-8"), flags=re.M), encoding="utf-8")
          print("версія", ВЕРСІЯ, "код", ЧИСЛОВА_ВЕРСІЯ, "збірка", дата, "коміт", коміт)
          PY
          echo "VERSIYA=$(python3 -c 'from yadro.versiya import ВЕРСІЯ; print(ВЕРСІЯ)')" >> "$GITHUB_ENV"


      # Глобальний кеш Buildozer (Android SDK/NDK, platform-tools) і Gradle
      # (залежності/дистрибутив) — важать сотні МБ і однакові від збірки
      # до збірки, доки не зміниться buildozer.spec; кеш скорочує час
      # повторних запусків.
      - name: Кеш Buildozer і Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Прийняти ліцензії Android SDK
        run: |
          set -e
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"

          # На холодному кеші SDK ще не існує — sdkmanager з'явиться лише
          # після того, як buildozer сам його завантажить. Тому перший
          # прогін нижче свідомо не перевіряється на успіх (|| true): він
          # впаде саме на неприйнятих ліцензіях, але встигне докачати SDK
          # і сам sdkmanager, чого нам і треба. На теплому кеші (SDK вже є
          # з попереднього запуску, ліцензії теж уже прийняті) цей крок
          # просто нічого не робить.
          if [ ! -d "$SDK_DIR" ]; then
            buildozer -v android debug || true
          fi

          SDKMANAGER=$(find "$SDK_DIR" -type f -name sdkmanager 2>/dev/null | head -n1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager не знайдено в $SDK_DIR навіть після першого прогону buildozer" >&2
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses || true

      # Що саме пакується: вміст yadro/ і версія — щоб у логу було видно,
      # що збирається свіжий код (перевірка проти «старого APK»).
      - name: Що пакується — yadro/ і версія
        run: |
          echo "коміт: $(git log -1 --oneline)"
          echo "версія: $(python3 -c 'from yadro.versiya import ВЕРСІЯ, ЧИСЛОВА_ВЕРСІЯ; print(ВЕРСІЯ, ЧИСЛОВА_ВЕРСІЯ)')"
          ls -la yadro/
          grep -n "^version\|numeric_version\|include_exts\|exclude_dirs\|^source.dir" buildozer.spec || true

      - name: Зібрати APK (buildozer android debug)
        run: buildozer -v android debug

      # Назва артефакта «мова-APK-<версія>»; зібрані програми — «програми-APK-…»
      # (zastosunky.yml). Файл усередині — mova-<версія>-arm64-v8a-debug.apk.
      - name: Завантажити APK в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: мова-APK-${{ env.VERSIYA }}
          path: bin/*.apk
          if-no-files-found: error
