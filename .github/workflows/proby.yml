name: Проби

# Проби — окремі застосунки в proby/, не частина мови. Кожна — своя job
# і свій артефакт. Збирається лише коли змінюється proby/ або цей
# workflow, або вручну (workflow_dispatch).
on:
  push:
    branches: [main]
    paths:
      - "proby/**"
      - ".github/workflows/proby.yml"
  workflow_dispatch: {}

jobs:
  gl-kub:
    name: Проба GL (куб) -> APK
    # Кроки й версії — як у build.yml (build-apk): ubuntu-22.04 через
    # рецепт libffi, Java 17 для Android Gradle Plugin.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Системні пакети для python-for-android
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache \
            libtool-bin libltdl-dev automake m4

      - name: Buildozer + Cython
        run: pip install buildozer cython

      # Тека збірки: main.py — це proby/gl_kub.py, buildozer.spec — це
      # proby/gl_kub.spec. Нічого іншого з репозиторію в APK не йде.
      - name: Тека збірки проби
        run: |
          mkdir -p zbirka_gl
          cp proby/gl_kub.py zbirka_gl/main.py
          cp proby/gl_kub.spec zbirka_gl/buildozer.spec
          ls -la zbirka_gl

      # Той самий кеш, що й у головної збірки (restore-keys підхоплює
      # SDK/NDK, завантажені build.yml) — налаштування p4a однакові.
      - name: Кеш Buildozer і Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('proby/gl_kub.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Прийняти ліцензії Android SDK
        working-directory: zbirka_gl
        run: |
          set -e
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          # Холодний кеш: перший прогін падає на ліцензіях, але докачує SDK
          if [ ! -d "$SDK_DIR" ]; then
            buildozer -v android debug || true
          fi
          SDKMANAGER=$(find "$SDK_DIR" -type f -name sdkmanager 2>/dev/null | head -n1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager не знайдено в $SDK_DIR навіть після першого прогону buildozer" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses || true

      - name: Зібрати APK (buildozer android debug)
        working-directory: zbirka_gl
        run: buildozer -v android debug

      - name: Завантажити APK в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: проба-GL-APK
          path: zbirka_gl/bin/*.apk
          if-no-files-found: error
