name: Застосунки з програм

# Кожна тека в застосунки/ — окремий Android-застосунок (програма.мова +
# main.py-запускач + buildozer.spec + icon.png, згенеровані zastosunky.py).
# Ядро мови (yadro/, zapusk.py, vidzhety.py) докладається сюди перед
# збіркою, щоб у репозиторії воно лишалось в одному місці. Артефакт
# зветься так само, як програма.
on:
  push:
    branches: [main]
    paths:
      - "застосунки/**"
      - "yadro/**"
      - "zapusk.py"
      - "vidzhety.py"
      - ".github/workflows/zastosunky.yml"
  workflow_dispatch: {}

# Ідентифікатори jobs/steps/outputs/matrix — латиницею: GitHub не приймає
# кирилицю в них (workflow тоді взагалі не розбирається, 0 jobs); назви
# (name:) можуть бути українськими.
jobs:
  list:
    name: Які застосунки збирати
    runs-on: ubuntu-22.04
    outputs:
      apps: ${{ steps.find.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          apps=$(python3 -c 'import json, pathlib; t = pathlib.Path("застосунки"); print(json.dumps(sorted(p.name for p in t.iterdir() if p.is_dir() and (p / "програма.мова").is_file()) if t.is_dir() else [], ensure_ascii=False))')
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Застосунки: $apps"

  build:
    name: APK «${{ matrix.app }}»
    needs: list
    if: needs.list.outputs.apps != '[]'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.list.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Системні пакети для python-for-android
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache \
            libtool-bin libltdl-dev automake m4

      - name: Buildozer + Cython
        run: pip install buildozer cython

      # Відомості про збірку для «Довідки» (yadro/zbirka.py) і versionCode
      # з yadro/versiya.py — щоб з телефона було видно, що встановлено
      - name: Відомості про збірку і числова версія
        run: |
          python3 - <<'PY'
          import datetime, os, pathlib, re
          from yadro.versiya import ВЕРСІЯ, ЧИСЛОВА_ВЕРСІЯ
          дата = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          коміт = os.environ.get("GITHUB_SHA", "")[:7] or "—"
          pathlib.Path("yadro/zbirka.py").write_text(
              f'"""Збірка (згенеровано workflow)."""\n\nДАТА = "{дата}"\nКОМІТ = "{коміт}"\n', encoding="utf-8")
          spec = pathlib.Path("застосунки") / os.environ["APP"] / "buildozer.spec"
          if spec.is_file():
              spec.write_text(re.sub(r"^android\.numeric_version = .*$", f"android.numeric_version = {ЧИСЛОВА_ВЕРСІЯ}", spec.read_text(encoding="utf-8"), flags=re.M), encoding="utf-8")
          print("версія", ВЕРСІЯ, "код", ЧИСЛОВА_ВЕРСІЯ, "збірка", дата, "коміт", коміт)
          PY
          echo "VERSIYA=$(python3 -c 'from yadro.versiya import ВЕРСІЯ; print(ВЕРСІЯ)')" >> "$GITHUB_ENV"


      - name: Кеш Buildozer і Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # Buildozer/p4a збирають у теці проєкту, а її шлях містить кирилицю
      # (застосунки/кабель) — рецепт pyjnius кличе javac із відносним
      # шляхом, і Java на раннері не бачить файл (user.dir не в UTF-8):
      # «error: file not found: jnius/src/.../NativeInvocationHandler.java».
      # Тому збираємо копію застосунку в теці з латинським шляхом.
      - name: Докласти ядро мови до застосунку (копія в ASCII-теці)
        run: |
          BUILD_DIR="$RUNNER_TEMP/mova_app"
          rm -rf "$BUILD_DIR"
          cp -r "застосунки/$APP" "$BUILD_DIR"
          cp -r yadro zapusk.py vidzhety.py "$BUILD_DIR/"
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          ls -la "$BUILD_DIR"

      - name: Прийняти ліцензії Android SDK
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -e
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          if [ ! -d "$SDK_DIR" ]; then
            buildozer -v android debug || true
          fi
          SDKMANAGER=$(find "$SDK_DIR" -type f -name sdkmanager 2>/dev/null | head -n1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager не знайдено в $SDK_DIR" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses || true

      - name: Зібрати APK
        working-directory: ${{ env.BUILD_DIR }}
        run: buildozer -v android debug

      # Назва артефакта: «програми-APK-<версія>-<програма>» — основний
      # застосунок зветься «мова-APK-<версія>» (build.yml).
      - name: Завантажити APK в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: програми-APK-${{ env.VERSIYA }}-${{ matrix.app }}
          path: ${{ env.BUILD_DIR }}/bin/*.apk
          if-no-files-found: error
